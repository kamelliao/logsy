[package]
name = "app"
version = "0.5.6"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# NOTE: `app` must stay the crate's only [[bin]]. The Tauri bundler treats every bin
# target in this manifest as something to ship — it ignores `required-features`, so a
# dev-only bin either breaks `tauri build` on a clean checkout (the binary was never
# compiled, so light.exe/dpkg can't find it) or gets installed onto users' machines.
# Dev helpers belong in `examples/` instead; see `examples/crosscheck.rs`.

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
encoding_rs = "0.8"
chardetng = "0.1"
# Match scanning for the frontend's filter engine (see `scan_lines`): one RegexSet
# pass over the log instead of one automaton per filter, spread across rayon workers.
regex = "1"
rayon = "1"

# Windows Jump List (taskbar-icon right-click tasks). Aligned to the version
# Tauri already pulls so it's the same compiled crate, not a second copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
] }
